<div id="atlas-editor-sketch" aria-label="Campaign atlas editor concept">
  <style>
    #atlas-editor-sketch{--a-bg:light-dark(#f5f3ed,#202422);--a-panel:light-dark(#ffffff,#292e2b);--a-text:light-dark(#24342c,#e9eee8);--a-muted:light-dark(#5c6b62,#aebbb1);--a-line:light-dark(#d8ded6,#48544b);--a-accent:light-dark(#2f6448,#a5d4b4);--a-selected:light-dark(#e1ede3,#354d3d);--a-map:#183127;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--a-text);color-scheme:light dark}
    #atlas-editor-sketch *{box-sizing:border-box}
    #atlas-editor-sketch button{font:inherit;color:inherit;cursor:pointer}
    #atlas-editor-sketch button:focus-visible{outline:3px solid var(--a-accent);outline-offset:3px}
    #atlas-editor-sketch .app{background:var(--a-bg);border:1px solid var(--a-line);border-radius:12px;overflow:hidden}
    #atlas-editor-sketch .top{padding:16px 112px 12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #atlas-editor-sketch .brand{font-weight:600}
    #atlas-editor-sketch .muted{color:var(--a-muted);font-size:12px}
    #atlas-editor-sketch .navigation{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 14px}
    #atlas-editor-sketch .navigation button,#atlas-editor-sketch .open{padding:8px 12px;border:1px solid var(--a-line);background:var(--a-panel);border-radius:6px}
    #atlas-editor-sketch .navigation button[aria-pressed=true]{background:var(--a-selected);border-color:var(--a-accent)}
    #atlas-editor-sketch .work{display:grid;grid-template-columns:minmax(0,1fr) 250px;border-top:1px solid var(--a-line)}
    #atlas-editor-sketch .map-wrap{min-width:0;position:relative;background:var(--a-map);align-self:start}
    #atlas-editor-sketch .map{position:relative}
    #atlas-editor-sketch .map img{display:block;width:100%;height:auto}
    #atlas-editor-sketch .pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;max-width:180px;min-height:32px;padding:4px 8px;background:var(--a-panel);border:1px solid var(--a-line);border-radius:6px;box-shadow:0 2px 8px #0005;text-align:left}
    #atlas-editor-sketch .pin[aria-pressed=true]{background:var(--a-selected);outline:2px solid var(--a-accent);outline-offset:2px}
    #atlas-editor-sketch .pin-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--a-accent)}
    #atlas-editor-sketch .pin-text{font-size:12px}
    #atlas-editor-sketch .map-footer{padding:8px 12px;background:var(--a-panel);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--a-muted)}
    #atlas-editor-sketch .inspector{padding:18px;background:var(--a-panel);border-left:1px solid var(--a-line);display:flex;flex-direction:column;gap:16px;min-width:0}
    #atlas-editor-sketch h2{font-size:18px;line-height:1.3;font-weight:600;margin:3px 0 0}
    #atlas-editor-sketch h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--a-muted);margin:0 0 7px}
    #atlas-editor-sketch p{margin:0}
    #atlas-editor-sketch .places{display:flex;flex-direction:column;gap:4px}
    #atlas-editor-sketch .place{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:8px;border:0;border-radius:5px;background:transparent}
    #atlas-editor-sketch .place[aria-pressed=true]{background:var(--a-selected)}
    #atlas-editor-sketch .place span:last-child{font-size:12px;color:var(--a-muted)}
    #atlas-editor-sketch .fields{display:grid;gap:9px}
    #atlas-editor-sketch .field{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px}
    #atlas-editor-sketch .field dt{color:var(--a-muted)}
    #atlas-editor-sketch .field dd{margin:0}
    #atlas-editor-sketch .note{padding-top:12px;border-top:1px solid var(--a-line)}
    #atlas-editor-sketch .view-options{padding:10px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--a-line);font-size:12px;color:var(--a-muted)}
    #atlas-editor-sketch .toggle{display:flex;align-items:center;gap:7px;cursor:pointer}
    #atlas-editor-sketch .empty{min-height:450px;display:grid;place-items:center;color:var(--a-muted)}
    #atlas-editor-sketch[data-dock=bottom] .work{grid-template-columns:1fr}
    #atlas-editor-sketch[data-dock=bottom] .inspector{border-left:0;border-top:1px solid var(--a-line);display:grid;grid-template-columns:1fr 1fr;align-items:start}
    @media(max-width:650px){#atlas-editor-sketch .work{grid-template-columns:1fr}#atlas-editor-sketch .inspector{border-left:0;border-top:1px solid var(--a-line)}#atlas-editor-sketch[data-dock=bottom] .inspector{grid-template-columns:1fr}#atlas-editor-sketch .pin{max-width:105px;min-height:36px;padding:4px 5px}#atlas-editor-sketch .pin-text{font-size:11px}#atlas-editor-sketch .top{padding-left:12px}#atlas-editor-sketch .navigation{padding-left:12px;padding-right:12px}}
    @media(pointer:coarse){#atlas-editor-sketch .navigation button,#atlas-editor-sketch .place,#atlas-editor-sketch .open,#atlas-editor-sketch .toggle{min-height:44px}}
  </style>

  <script>
  (()=>{
    const root=document.getElementById('atlas-editor-sketch');
    const images=JSON.parse(root.querySelector('#atlas-image-data').textContent);
    const views={
      world:{name:'World',alt:'Original fantasy world map with Khartoum, a pyramid, and a crater in the south',places:[
        {id:'khartoum',name:'Khartoum',kind:'City',x:65,y:84,fields:[['Terrain','Desert coast'],['Map','City developed']],note:'Open the city while keeping its place in the wider world.',target:'city'},
        {id:'pyramid',name:'Pyramid',kind:'Dungeon',x:94,y:74,fields:[['Terrain','Desert'],['Map','Interior developed']],note:'The regional site leads to its interior map.',target:'dungeon'},
        {id:'crater',name:'Crater',kind:'Location',x:85,y:67,fields:[['Status','To develop'],['History','Party starting area']],note:'A place can remain lightly defined while other areas are developed.'}
      ]},
      city:{name:'Khartoum · city',alt:'Original Khartoum city map showing a raised walled district and the lower waterfront',places:[
        {id:'upper',name:'Upper district',kind:'District',x:41,y:19,fields:[['Ground','Raised plateau'],['Boundary','Walled'],['Character','Prosperous']],note:'Preserve the plateau, wall, and chosen landmarks when developing this district.'},
        {id:'market',name:'Market',kind:'Area',x:40,y:63,fields:[['Purpose','Trade'],['Ground','Lower city']],note:'Browse locations within an area without having to distinguish every shop by its roof.'},
        {id:'docks',name:'Docks',kind:'Landmark',x:42,y:79,fields:[['Purpose','Waterfront'],['Map','City exterior']],note:'Keep named places attached to the map as buildings and dressing change.'}
      ]},
      dungeon:{name:'Pyramid · interior',alt:'Original pyramid chamber map with sarcophagi, a central column, and a serpent statue',places:[
        {id:'column',name:'Central column',kind:'Object',x:50,y:50,fields:[['Appearance','Marked column'],['GM note','Mimic']],note:'Keep the visible object and its private encounter notes together.'},
        {id:'doors',name:'Secret doors',kind:'Linked pair',x:25,y:29,fields:[['Locations','Upper left and right'],['Opens after','Riddle answered']],note:'One working note can refer to both doors. Player display would hide this annotation.'},
        {id:'serpent',name:'Serpent statue',kind:'Object',x:50,y:78,fields:[['Appearance','Statue with loot'],['GM note','Bone naga']],note:'Riddle and encounter consequences belong to the selected statue.'}
      ]}
    };
    let state={view:'city',selected:'upper',labels:true};
    const design={inspector:'right'};
    const saved=window.openai?.widgetState;
    function restore(value){const s=value?.modelContent;if(s&&views[s.view]){state.view=s.view;if(views[s.view].places.some(p=>p.id===s.selected))state.selected=s.selected;else state.selected=views[s.view].places[0].id;if(typeof s.labels==='boolean')state.labels=s.labels;}const d=value?.privateContent?.inspector;if(d==='right'||d==='bottom')design.inspector=d;}
    restore(saved);
    function save(){window.openai?.setWidgetState?.({modelContent:{view:state.view,selected:state.selected,labels:state.labels},privateContent:{inspector:design.inspector}})?.catch(()=>{});}
    function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
    function choose(id){state.selected=id;render();save();}
    function navigate(view){state.view=view;state.selected=views[view].places[0].id;render();save();}
    function render(){
      root.dataset.dock=design.inspector;
      const view=views[state.view],selected=view.places.find(p=>p.id===state.selected)||view.places[0];
      const map=root.querySelector('.map');map.replaceChildren();
      const img=el('img');img.src=images[state.view];img.alt=view.alt;map.append(img);
      view.places.forEach(p=>{const b=el('button','pin');b.type='button';b.style.left=p.x+'%';b.style.top=p.y+'%';b.setAttribute('aria-label',p.name);b.setAttribute('aria-pressed',String(p.id===selected.id));b.append(el('span','pin-dot'));if(state.labels)b.append(el('span','pin-text',p.name));b.onclick=()=>choose(p.id);map.append(b);});
      const list=root.querySelector('#atlas-places');list.replaceChildren();
      view.places.forEach(p=>{const b=el('button','place');b.type='button';b.setAttribute('aria-pressed',String(p.id===selected.id));b.append(el('span','',p.name),el('span','',p.kind));b.onclick=()=>choose(p.id);list.append(b);});
      root.querySelector('#atlas-selection-title').textContent=selected.name;
      const fields=root.querySelector('#atlas-fields');fields.replaceChildren();selected.fields.forEach(([label,value])=>{const row=el('div','field');row.append(el('dt','',label),el('dd','',value));fields.append(row);});
      root.querySelector('#atlas-note').textContent=selected.note;
      root.querySelector('#atlas-map-location').textContent=view.name;
      root.querySelector('#atlas-status').textContent=selected.name+' selected';
      root.querySelector('#atlas-labels').checked=state.labels;
      root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
      const slot=root.querySelector('#atlas-open-slot');slot.replaceChildren();if(selected.target){const open=el('button','open','Open '+(selected.target==='city'?'city':'interior'));open.type='button';open.onclick=()=>navigate(selected.target);slot.append(open);}
    }
    root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
    root.querySelector('#atlas-labels').onchange=e=>{state.labels=e.target.checked;render();save();};
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(design,'inspector',{label:'Place details position',options:[{label:'Beside the map',value:'right'},{label:'Below the map',value:'bottom'}]});}
  })();
  </script>
</div>
